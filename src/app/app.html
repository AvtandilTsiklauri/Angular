<div class="container">
  <h1>Product Management</h1>

  <h2>Add New Product</h2>

  <form
    (submit)="addProduct(
      nameInput.value,
      priceInput.value,
      departmentInput.value,
      skuInput.value
    ); $event.preventDefault();
      nameInput.value = '';
      priceInput.value = '';
      departmentInput.value = '';
      skuInput.value = ''">

    <div class="form-group">
      <label>Product Name</label>
      <input #nameInput type="text" placeholder="Product name">
    </div>

    <div class="form-group">
      <label>Price</label>
      <input #priceInput type="number" min="0.01" step="0.01" placeholder="Price">
    </div>

    <div class="form-group">
      <label>Department</label>
      <input #departmentInput type="text" placeholder="Department">
    </div>

    <div class="form-group">
      <label>SKU</label>
      <input #skuInput type="text" placeholder="SKU">
    </div>

    <button type="submit">Add Product</button>
  </form>

  <app-products-list
    [products]="products"
    (deleteProduct)="deleteProduct($event)">
  </app-products-list>

  <h2>Total Inventory Value: ${{ getTotalValue().toFixed(2) }}</h2>
</div>
